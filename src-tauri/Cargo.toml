[package]
name = "whisp"
version = "0.1.0"
description = "whisp — offline-first voice dictation for Linux (Hyprland/Wayland)"
authors = ["whisp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "whisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whisp"
path = "src/main.rs"

[[bin]]
name = "whisp-hook"
path = "src/bin/whisp-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "blocking",
] }
cpal = "0.15"
ringbuf = "0.4"
hound = "3"
keyring = "3"
dirs = "5"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
