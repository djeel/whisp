[package]
name = "whisp"
version = "0.1.4"
authors = ["whisp"]
edition = "2021"
rust-version = "1.77"
default-run = "whisp"

[lib]
name = "whisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whisp"
path = "src/main.rs"

[[bin]]
name = "whisp-hook"
path = "src/bin/whisp-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "blocking",
] }
cpal = "0.15"
ringbuf = "0.4"
hound = "3"
keyring = "3"
dirs = "5"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
# Historique chiffré au repos : XChaCha20-Poly1305, clé = SHA256(machine-id).
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
