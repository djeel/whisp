name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libpipewire-0.3-dev libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: frontend dist (requis par generate_context! au build)
        run: bun install --frozen-lockfile && bun run build
      - name: smoke MCP (sans app)
        run: python3 tests/mcp_smoke.py
      - name: fmt check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: clippy
        continue-on-error: true # ~30 warnings préexistants (MSRV 1.77, dead code) : informatif, pas bloquant
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: shellcheck install.sh
        run: bash -n install.sh && bash -n install-hook.sh
      - name: python compile
        run: python3 -m py_compile mcp_server.py src-tauri/src/stt_server.py

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      - name: svelte-check
        run: bun run check
      - name: build
        run: bun run build
